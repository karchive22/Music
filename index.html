<body>

<h1 class="CenterColor">Music Player Online</h1>
<h2 class="CenterColor">Used some code from github in order to assist along with AI. </h2>
<div id="searchContainer">
    <input type="text" id="searchInput" onkeyup="searchButtons()" placeholder="Search for music" style="background-color: #1ED760" style="color: white">
</div>

<div class="button-container"> 
<a class="button" href="Music/67PhonkSpyrix.html">

    </div>
    SLAVA MARLOW - Ты Горишь Как Огонь
</a>

</div>

<script>
function searchButtons() {
    const input = document.getElementById("searchInput").value.toLowerCase();
    const buttons = document.querySelectorAll(".button");

    buttons.forEach(btn => {
        const text = btn.innerText.toLowerCase();
        btn.style.display = text.includes(input) ? "flex" : "none";
    });
}
</script>
